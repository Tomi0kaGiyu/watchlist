<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchlist Pro v2</title>
<style>
body{margin:0;font-family:system-ui;background:#111;color:#eee}
header{position:sticky;top:0;background:#1b1b1b;padding:12px;z-index:10}
.wrap{max-width:1200px;margin:auto;padding:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input,button,select{background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
.card{background:#1c1c1c;border-radius:12px;padding:10px}
.top{display:flex;justify-content:space-between;gap:8px}
.stat{font-size:14px;opacity:.9}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="wrap">
<h2>🎬 Watchlist Pro v2</h2>
<div id="stats" class="stat"></div>
<div class="controls">
<input id="search" placeholder="Поиск...">
<button onclick="addItem()">➕ Добавить</button>
<button onclick="randomPick()">🎲 Случайный</button>
<button onclick="exportData()">📤 Экспорт</button>
<button onclick="document.getElementById('importFile').click()">📥 Импорт</button>
<input type="file" id="importFile" hidden>
</div>
</div>
</header>
<div class="wrap">
<div id="random"></div>
<div id="list" class="grid"></div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('watchlistData')||'[]');

function save(){localStorage.setItem('watchlistData',JSON.stringify(data));render();}

function addItem(){
 const name=prompt('Название');
 if(!name)return;
 const cat=prompt('Категория','Кино')||'Кино';
 data.push({name,cat,status:'planned',rating:0,favorite:false});
 save();
}

function del(i){
 if(confirm('Удалить?')){data.splice(i,1);save();}
}

function randomPick(){
 const pool=data.filter(x=>!['done','dropped'].includes(x.status));
 if(!pool.length)return;
 const r=pool[Math.floor(Math.random()*pool.length)];
 document.getElementById('random').innerHTML='<div class="card">🎲 '+r.name+'</div>';
}

function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='watchlist-backup.json';
 a.click();
}

document.getElementById('importFile').onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
   try{
     data=JSON.parse(r.result);
     save();
     alert('Импорт завершён');
   }catch(err){alert('Ошибка JSON');}
 };
 r.readAsText(f);
};

function render(){
 const q=(document.getElementById('search').value||'').toLowerCase();
 const filtered=data.filter(x=>(x.name||'').toLowerCase().includes(q));

 const done=data.filter(x=>x.status==='done').length;
 const fav=data.filter(x=>x.favorite).length;
 document.getElementById('stats').textContent=`Всего: ${data.length} | Просмотрено: ${done} | Избранное: ${fav}`;

 document.getElementById('list').innerHTML=filtered.map(item=>{
 const i=data.indexOf(item);
 return `<div class="card">
 <div class="top">
 <b>${item.favorite?'❤️ ':''}${item.name}</b>
 <button onclick="del(${i})">🗑️</button>
 </div>
 <div>${item.cat||''}</div><br>
 <select onchange="data[${i}].status=this.value;save()">
 <option value="planned" ${item.status==='planned'?'selected':''}>📌 В планах</option>
 <option value="finish" ${item.status==='finish'?'selected':''}>▶ Нужно досмотреть</option>
 <option value="paused" ${item.status==='paused'?'selected':''}>⏸ На паузе</option>
 <option value="done" ${item.status==='done'?'selected':''}>✅ Просмотрено</option>
 <option value="dropped" ${item.status==='dropped'?'selected':''}>❌ Брошено</option>
 </select><br><br>
 ⭐ <input type="number" min="0" max="10" value="${item.rating||0}" style="width:60px"
 onchange="data[${i}].rating=parseInt(this.value)||0;save()">
 <button onclick="data[${i}].favorite=!data[${i}].favorite;save()">${item.favorite?'❤️':'🤍'}</button>
 </div>`;
 }).join('');
}
document.getElementById('search').addEventListener('input',render);
render();
</script>
</body>
</html>
